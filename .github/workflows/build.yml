name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check and test
        run: pnpm run typecheck && pnpm test

      - name: Build whisper.cpp (Windows)
        run: pnpm run build:whisper

      - name: Build llama.cpp (Windows)
        run: pnpm run build:llama

      - name: Build Windows installer
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: local-ai-video-player-windows
          path: |
            dist/*.exe
            dist/*.blockmap

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check and test
        run: pnpm run typecheck && pnpm test

      - name: Build whisper.cpp (macOS)
        run: pnpm run build:whisper

      - name: Build llama.cpp (macOS)
        run: pnpm run build:llama

      - name: Build macOS installer
        run: pnpm run build:mac:release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: local-ai-video-player-macos
          path: |
            dist/*.dmg
            dist/*.zip
